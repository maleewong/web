<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hearts Game - Version 3.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="table">
            <!-- Hands -->
            <div id="player-top" class="player hand"></div>
            <div id="player-left" class="player hand"></div>
            <div id="player-right" class="player hand"></div>
            <div id="player-bottom" class="player hand"></div>

            <!-- Center pile -->
            <div id="center-pile"></div>
        </div>
    </div>

    <!-- 🔘 ปุ่มเปิด popup แสดงไพ่ที่เก็บได้ -->
    <button id="view-scores-btn">👁 ดูไพ่ที่เก็บได้</button>

    
    <!-- 🎯 ตัวเลือกจำนวนรอบ -->
    <div id="round-select-wrapper">
        <label for="round-select">เลือกจำนวนรอบ: </label>
        <select id="round-select">
            <option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
        </select>
    </div>
    
    
    <!-- 📊 ปุ่มแสดงคะแนน -->
    <button id="score-summary-btn">📊 คะแนน</button><span id="round-status" style="display:none;">รอบที่ 0/0</span>
    
    <!-- 🔘 ปุ่มเริ่มเกม -->
    <button id="start-btn">▶️ เริ่มเกม</button>

    <script src="app.js"></script>
    <script>
    function scaleGame() {
        const designWidth = 1280;
        const designHeight = 720;
        const scaleX = window.innerWidth / designWidth;
        const scaleY = window.innerHeight / designHeight;
        const scale = Math.max(0.75, Math.min(scaleX, scaleY));
        const wrapper = document.querySelector('.wrapper');
        wrapper.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', scaleGame);
    window.addEventListener('load', scaleGame);
    </script>

    <!-- 🔗 ปุ่มวิธีเล่น -->
    <a href="how_to_play_Jubmoo.html" target="_blank" id="how-to-play-btn">📘 วิธีเล่น</a>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PeerJS Room Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #chat { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; margin-top: 10px; }
    input, button { padding: 5px; }
    .log { margin: 5px 0; }
  </style>
</head>
<body>

  <h1>PeerJS Room Chat</h1>
  <label for="room">Room ID: </label>
  <input type="text" id="room" placeholder="Enter room ID" />
  <button onclick="joinRoom()">Join Room</button>

  <div id="status" class="log">❌ Not connected.</div>
  <div id="chat"></div>

  <input type="text" id="message" placeholder="Type a message" />
  <button onclick="sendMessage()">Send</button>

  <script>
    let peer;
    let connections = [];
    let roomId = '';
    const chatBox = document.getElementById('chat');
    const status = document.getElementById('status');

    function log(message) {
      const div = document.createElement('div');
      div.textContent = message;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function joinRoom() {
      roomId = document.getElementById('room').value;
      if (!roomId) return alert("Please enter a room ID.");

      peer = new Peer(null, {
        host: 'peerjs-server-xe61.onrender.com',
        port: 10000,
        path: '/',
        secure: true
      });

      peer.on('open', id => {
        status.textContent = `✅ Connected as ID: ${id}`;
        peer.listAllPeers(peers => {
          peers.forEach(pid => {
            if (pid !== id && pid.startsWith(roomId)) {
              const conn = peer.connect(pid);
              setupConnection(conn);
            }
          });
        });
      });

      peer.on('connection', conn => {
        setupConnection(conn);
      });
    }

    function setupConnection(conn) {
      connections.push(conn);
      conn.on('open', () => {
        log(`🔗 Connected to ${conn.peer}`);
      });
      conn.on('data', data => {
        log(`📥 ${conn.peer}: ${data}`);
      });
    }

    function sendMessage() {
      const msg = document.getElementById('message').value;
      if (!msg) return;
      log(`📤 You: ${msg}`);
      connections.forEach(conn => conn.send(msg));
      document.getElementById('message').value = '';
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Match-Up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <h1>Math Match-Up</h1>
    <p>Match the equations with their correct answers!</p>
    <button id="start-button">Start Game</button>
    <div id="timer">Time Left: <span id="time">60</span>s</div>
    <div id="game-board" class="grid"></div>
    <div id="score-board">Score: <span id="score">0</span></div>
    <div id="mistakes-board">Mistakes: <span id="mistakes">0</span></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
